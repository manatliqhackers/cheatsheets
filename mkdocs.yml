site_name: Manatliq CheatSheets
site_url: https://manatliqhackers.github.io/

theme:
  name: material
  icon:
    logo: fontawesome/solid/manat-sign
  favicon: assets/favicon.ico
  palette:
    scheme: slate          # dark mode
    primary: black
    accent: red
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy    # adds copy button to code blocks

nav:
  - Home: index.md
  - Active Directory:
    - Transferring Files: active-directory/transferring-file.md
    - Reverse Shell: active-directory/getting-a-shell.md
    - Bloodhound: active-directory/bloodhound.md
    - BloodyAd: active-directory/bloodyAd.md
  - Powershell:
    - Get Computers: active-directory/getting-computers.md
    - Retrieve Deleted Users: active-directory/deleted-users.md

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details


extra_css:
  - stylesheets/extra.css
